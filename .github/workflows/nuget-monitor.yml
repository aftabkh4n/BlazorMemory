name: NuGet Daily Monitor

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC daily
  workflow_dispatch:       # run manually from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    name: Stats and package health
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Stats are collected and committed before the health check, so a failed
      # health check never loses that day's numbers.
      - name: Collect NuGet download stats
        run: bash .github/scripts/nuget-stats.sh

      - name: Commit stats history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/
          # [skip ci] stops the daily stats commit from triggering the CI workflow.
          git diff --staged --quiet || git commit -m "chore: nuget stats $(date -u +%Y-%m-%d) [skip ci]"
          git push

      - name: Check if today is health-check day
        id: day
        run: echo "weekday=$(date -u +%u)" >> "$GITHUB_OUTPUT"

      # Runs Mondays only, or on a manual run. Every run restores all packages
      # from nuget.org, which counts as downloads, so daily runs inflate stats.
      - name: Verify packages are listed and installable
        if: steps.day.outputs.weekday == '1' || github.event_name == 'workflow_dispatch'
        run: bash .github/scripts/package-health.sh

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated,health-check'
            });
            if (existing.data.length > 0) return;

            const today = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Package health check failed (${today})`,
              labels: ['automated', 'health-check'],
              body: [
                'The daily NuGet monitor failed.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Possible causes:',
                '- A package was unlisted or delisted',
                '- A published package no longer restores or builds',
                '- Packages conflict when installed together',
                '- A new package was added to expected-packages.txt before NuGet indexed it (wait and re-run)',
                '- NuGet API unavailable (transient, safe to close)'
              ].join('\n')
            });

  dependency-audit:
    name: Vulnerability and deprecation scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore BlazorMemory.sln

      - name: Scan
        run: |
          dotnet list BlazorMemory.sln package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          dotnet list BlazorMemory.sln package --deprecated 2>&1 | tee deprecated.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "VULNERABLE=true" >> "$GITHUB_ENV"
          fi

      - name: Open issue on vulnerability
        if: env.VULNERABLE == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated,security'
            });
            if (existing.data.length > 0) return;

            const report = require('fs').readFileSync('vuln.txt', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Vulnerable dependency detected',
              labels: ['automated', 'security'],
              body: '```\n' + report.slice(0, 60000) + '\n```'
            });

  regression:
    name: Scheduled full test run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Test
        run: dotnet test BlazorMemory.sln --configuration Release

      - name: Open issue on regression
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automated,regression'
            });
            if (existing.data.length > 0) return;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Scheduled test run failed on main',
              labels: ['automated', 'regression'],
              body: [
                'The nightly test run failed with no code change.',
                'Usually a transitive dependency shifted under a floating version range.',
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join('\n')
            });
